<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>4급 어휘 예습</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F6F7F4; --surface:#FFFFFF; --ink:#1E2748; --muted:#5B6275;
  --line:#D9DCE3; --grid:#C9503F; --grid-soft:rgba(201,80,63,.10);
  --ok:#2F7A55; --ok-soft:rgba(47,122,85,.10); --sel:#E9ECF6;
  --g:#2F7A55; --y:#B7860B; --r:#C9503F;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#141728; --surface:#1C2036; --ink:#EEF0F7; --muted:#A3A9BD;
    --line:#2E3352; --grid:#E27A6B; --grid-soft:rgba(226,122,107,.14);
    --ok:#62C08F; --ok-soft:rgba(98,192,143,.14); --sel:#262B47;
    --g:#62C08F; --y:#E0B84A; --r:#E27A6B;
  }
}
:root[data-theme="dark"]{
  --paper:#141728; --surface:#1C2036; --ink:#EEF0F7; --muted:#A3A9BD;
  --line:#2E3352; --grid:#E27A6B; --grid-soft:rgba(226,122,107,.14);
  --ok:#62C08F; --ok-soft:rgba(98,192,143,.14); --sel:#262B47;
  --g:#62C08F; --y:#E0B84A; --r:#E27A6B;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0;min-height:100%}
body{
  background:var(--paper);color:var(--ink);
  font-family:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  font-size:17px;line-height:1.55;-webkit-text-size-adjust:100%;
}
#app{max-width:480px;margin:0 auto;padding:22px 20px 48px}
h1,h2,h3{font-weight:600;margin:0}
h2{font-size:1.35rem}
.muted{color:var(--muted)}
.small{font-size:.9rem}
p{margin:.4rem 0}

.cells{display:flex;padding-left:2px}
.cell{width:2.4em;height:2.4em;margin-left:-2px;border:2px solid var(--grid);display:grid;place-items:center;
  background:var(--surface);font-family:"Gowun Batang",serif;font-weight:700;font-size:2rem}

/* 머리 */
.head{margin-bottom:22px}
.head .label{display:flex;justify-content:space-between;gap:12px;font-size:.92rem;color:var(--muted)}
.head .label b{color:var(--ink);font-weight:600}
.bar{height:10px;border:2px solid var(--grid);margin-top:8px}
.bar i{display:block;height:100%;background:var(--grid)}

/* 입력, 버튼 */
label.f{display:block;font-weight:600;margin:24px 0 8px}
input[type=text],select{
  width:100%;font:inherit;font-size:1.1rem;padding:14px 16px;
  border:2px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);
}
input[type=text]:focus,select:focus{outline:none;border-color:var(--ink)}
.btn{
  display:block;width:100%;font:inherit;font-weight:600;font-size:1.05rem;padding:16px;
  border-radius:10px;border:2px solid var(--ink);background:var(--ink);color:var(--paper);cursor:pointer;margin-top:14px;
}
.btn.ghost{background:transparent;color:var(--ink)}
.btn:disabled{opacity:.35;cursor:not-allowed}
.row{display:flex;gap:10px}.row .btn{margin-top:0}.row .btn.back{flex:0 0 32%}
.link{font:inherit;font-size:.88rem;background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;padding:6px 0}
:is(.btn,.opt,.self,.say,.chip,.blank,.link,.day):focus-visible{outline:3px solid var(--grid);outline-offset:2px}
.hint{color:var(--muted);font-size:.88rem;margin:10px 0 0;min-height:1.3em}
.err{color:var(--grid);font-size:.9rem;min-height:1.3em;margin:6px 0 0}

/* 시작 */
.days{display:grid;gap:12px;margin-top:4px}
.dayrow{border:2px solid var(--line);border-radius:10px;background:var(--surface);padding:4px 4px 8px}
.day{width:100%;font:inherit;text-align:left;background:none;border:0;color:var(--ink);cursor:pointer;
  padding:12px 14px 4px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.day b{font-size:1.15rem}.day small{display:block;color:var(--muted);font-size:.9rem}
.day .st{font-size:.88rem;color:var(--muted);white-space:nowrap}.day .st.done{color:var(--ok);font-weight:600}
.dayrow .link{margin-left:14px}

/* 1단계 */
.word{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:6px 0 4px}
.word strong{font-family:"Gowun Batang",serif;font-size:2.4rem;line-height:1.25}
.say{font:inherit;font-size:.88rem;cursor:pointer;border:1.5px solid var(--line);border-radius:999px;
  background:var(--surface);color:var(--ink);padding:5px 12px}
.say[hidden]{display:none}
[hidden]{display:none !important}   /* 숨긴 버튼이 빈 막대로 보이지 않게 */
.desc{margin-top:16px;padding:14px 16px;border-left:4px solid var(--grid);background:var(--surface);border-radius:0 10px 10px 0}
.desc .t{display:flex;justify-content:space-between;align-items:center;gap:8px;color:var(--muted);font-size:.88rem}
.desc p{font-size:1.12rem;margin:6px 0 0}
.selfs{display:grid;gap:8px}
.self{font:inherit;text-align:left;padding:13px 16px;border:2px solid var(--line);border-radius:10px;
  background:var(--surface);color:var(--ink);cursor:pointer;font-size:1rem}
.self[aria-pressed="true"]{border-color:var(--ink);background:var(--sel);font-weight:600}

/* 통계 */
.stats{margin:18px 0 0;border-top:2px solid var(--line)}
.stats div{display:flex;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--line)}
.stats div b{font-weight:600}
.big{font-family:"Gowun Batang",serif;font-size:3rem;font-weight:700;line-height:1.1;margin:14px 0 4px}
.words{margin:10px 0 0;padding:12px 14px;background:var(--surface);border-radius:10px;border:1px solid var(--line)}

/* 2단계 */
.prompt{font-size:1.3rem;font-weight:600;line-height:1.55;margin:4px 0 20px}
.opts{display:grid;gap:10px}
.opt{font:inherit;font-size:1.2rem;text-align:left;padding:16px 18px;border:2px solid var(--line);border-radius:10px;
  background:var(--surface);color:var(--ink);cursor:pointer}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--ok);background:var(--ok-soft);font-weight:600}
.opt.wrong{border-color:var(--grid);background:var(--grid-soft)}
.fb{margin:14px 0 0;font-weight:600;min-height:1.5em}
.fb.ok{color:var(--ok)}.fb.no{color:var(--grid)}
.memo{color:var(--muted);font-weight:400;font-size:.92rem;margin-top:4px}

/* 3단계 */
.bank{position:sticky;top:env(safe-area-inset-top,0px);z-index:2;background:var(--paper);padding:10px 0 12px;
  display:flex;flex-wrap:wrap;gap:8px;border-bottom:2px solid var(--line)}
.chip{font:inherit;font-size:1.02rem;padding:9px 14px;border-radius:999px;border:2px solid var(--ink);
  background:var(--surface);color:var(--ink);cursor:pointer}
.chip.used{opacity:.6;border-style:dashed}
.chip.used::before{content:"✓ ";font-size:.85em}
.chip.unused{border-color:var(--grid);color:var(--grid)}
.sents{list-style:none;margin:16px 0 0;padding:0}
.sents li{padding:14px 0;border-bottom:1px solid var(--line);font-size:1.08rem;line-height:2}
.sents li .n{color:var(--grid);font-weight:600;margin-right:6px}
.blank{font:inherit;min-width:5.5em;padding:2px 10px;border:0;border-bottom:3px solid var(--line);
  background:var(--grid-soft);color:var(--ink);cursor:pointer;border-radius:6px 6px 0 0;font-weight:600}
.blank.active{border-bottom-color:var(--grid);background:var(--sel)}
.blank.ok{border:2px solid var(--ok);border-radius:6px;background:var(--ok-soft)}
.blank.no{border:2px solid var(--grid);border-radius:6px;background-color:var(--grid-soft);
  background-image:linear-gradient(to top right,transparent calc(50% - 1.5px),var(--grid) calc(50% - 1.5px),var(--grid) calc(50% + 1.5px),transparent calc(50% + 1.5px))}
.chip,.blank{touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.chip.dragging,.blank.dragging{opacity:.35}
.blank.over{outline:3px dashed var(--grid);outline-offset:2px}
.bank.over{background:var(--grid-soft)}
.dragghost{position:fixed;left:0;top:0;pointer-events:none;z-index:50;padding:9px 16px;border-radius:999px;
  background:var(--ink);color:var(--paper);font-weight:600;font-size:1.05rem;box-shadow:0 6px 18px rgba(0,0,0,.25);
  transform:translate(-50%,-130%)}
.sents li .n{display:inline-grid;place-items:center;min-width:1.9em;height:1.9em;position:relative;margin-right:4px}
.sents li.ok .n{border:2.5px solid var(--grid);border-radius:50%}
.sents li.no .n::after{content:"";position:absolute;left:-6px;right:-6px;top:50%;height:3px;background:var(--grid);transform:rotate(-58deg);border-radius:2px}
.sents li .gram{color:var(--muted);font-size:.9em}
.mark{display:block;font-size:.95rem;line-height:1.5;font-weight:600;margin-top:6px}
.mark .pair{display:block;font-weight:400;color:var(--ink)}
.mark .pair b{font-weight:600}
.journey{list-style:none;margin:10px 0 0;padding:0;border-top:2px solid var(--line)}
.journey li{padding:10px 0;border-bottom:1px solid var(--line)}
.journey b{font-size:1.08rem}
.journey span{display:block;color:var(--muted);font-size:.88rem}
.kind{margin:22px 0 0;font-weight:600}
.mark.ok{color:var(--ok)}.mark.no{color:var(--grid)}

.cyc{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:.85rem;color:var(--muted);margin-bottom:14px}
.cells5{display:inline-flex;padding-left:2px}
.cells5 i{width:22px;height:12px;border:2px solid var(--grid);margin-left:-2px}
.cells5 i.done{background:var(--grid)}.cells5 i.now{background:var(--grid-soft)}
.total{margin-top:22px}.total .label{display:flex;justify-content:space-between;color:var(--muted);font-size:.95rem}.total .label b{color:var(--ink)}
.allok{margin:16px 0 0;padding:14px 16px;border-radius:10px;background:var(--ok-soft);color:var(--ok);font-weight:600}
.dayrow .dayacts{display:flex;gap:14px;padding-left:14px}.dayrow .dayacts .link{margin-left:0}
.link.strong{color:var(--ink);font-weight:600}
.vctrl{position:sticky;top:env(safe-area-inset-top,0px);z-index:2;background:var(--paper);padding:8px 0 10px;border-bottom:2px solid var(--line);margin-top:14px}
.vcap{font-size:.82rem;color:var(--muted);margin:6px 0 6px}
.vfilters,.vhides{display:flex;flex-wrap:wrap;gap:6px}
.vchip{font:inherit;font-size:.9rem;padding:7px 12px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.vchip[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--paper);font-weight:600}
.vchip.hide[aria-pressed="true"]{background:var(--grid);border-color:var(--grid);color:#fff}
.vlist{list-style:none;margin:10px 0 0;padding:0}
.vlist>li{padding:14px 0;border-bottom:1px solid var(--line)}
.vtop{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:4px}
.vno{color:var(--grid);font-weight:600;font-size:.85rem}
.vtags{display:flex;gap:6px;flex-wrap:wrap}
.vtag{font-size:.75rem;font-weight:600;padding:2px 8px;border-radius:999px;border:1.5px solid}
.vtag.red{color:var(--r);border-color:var(--r)}.vtag.yellow{color:var(--y);border-color:var(--y)}.vtag.new{color:var(--muted);border-color:var(--line)}
.vrow{display:flex;align-items:center;gap:8px;margin-top:6px}
.vrow>button:first-child,.vrow .vlabel+button{flex:1}
.vword,.vdesc,.vnative{font:inherit;text-align:left;background:none;border:0;padding:4px 0;color:var(--ink);cursor:default;min-height:2em}
.vword{font-family:"Gowun Batang",serif;font-weight:700;font-size:1.45rem}
.vdesc{font-size:1rem}
.vnative{font-size:1rem;color:var(--muted)}
.vword.open,.vdesc.open,.vnative.open{cursor:pointer;border-bottom:1.5px dashed var(--line)}
.vlabel{font-size:.78rem;color:var(--muted);white-space:nowrap;border:1px solid var(--line);border-radius:6px;padding:1px 6px}
.cover{cursor:pointer !important;color:var(--muted) !important;font-family:inherit !important;font-weight:400 !important;font-size:.9rem !important;
  border-radius:8px !important;padding:8px 12px !important;background:repeating-linear-gradient(-45deg,var(--grid-soft) 0 8px,transparent 8px 16px),var(--surface) !important;border:1.5px dashed var(--grid) !important}
.vempty{color:var(--muted);text-align:center;padding:28px 0 !important}
.vrow .say{padding:4px 10px}
.sync{margin:16px 0 4px;padding:14px 16px;border-radius:10px;border:2px solid var(--line);background:var(--surface)}
.sync b{display:block;font-size:1.02rem}.sync span{display:block;color:var(--muted);font-size:.88rem;margin-top:4px}
.sync.ok{border-color:var(--ok);background:var(--ok-soft)}.sync.ok b{color:var(--ok)}
.sync.fail{border-color:var(--grid);background:var(--grid-soft)}.sync.fail b{color:var(--grid)}
.answer{margin-top:8px;padding:10px 14px 12px;border:2px solid var(--ok);border-radius:10px;background:var(--ok-soft)}
.answer-t{display:block;font-size:.85rem;font-weight:600;color:var(--ok);line-height:1.4}
.answer p{margin:4px 0 0;font-size:1.05rem;line-height:1.9;color:var(--ink)}
.answer .ans{display:inline-block;padding:0 10px;border:2px solid var(--ok);border-radius:6px;background:var(--surface);color:var(--ok);font-weight:700;line-height:1.7}
.sents li .pair{display:block;margin-top:8px;font-size:.92rem;line-height:1.5;color:var(--muted)}
.sents li .pair b{color:var(--grid);font-weight:600}.sents li .pair b.ok{color:var(--ok)}
.dayhead{display:flex;align-items:baseline;gap:10px;padding:10px 14px 2px}.dayhead b{font-size:1.15rem}.dayhead small{color:var(--muted);font-size:.9rem}
.dayrow .day{padding:10px 14px}.dayrow .day + .day{border-top:1px solid var(--line)}
.dayrow .day span small{display:inline;margin-left:8px;color:var(--muted);font-size:.85rem}
.exhead{position:sticky;top:env(safe-area-inset-top,0px);z-index:3;background:var(--paper);padding:6px 0 10px;border-bottom:2px solid var(--line)}
.exrow{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:.92rem;color:var(--muted)}
.exrow b{color:var(--ink)}
.extimer{font-family:"Gowun Batang",serif;font-weight:700;font-size:1.6rem;color:var(--ink);font-variant-numeric:tabular-nums}
.extimer.low{color:var(--grid)}
.opt[aria-pressed="true"]{border-color:var(--ink);background:var(--sel);font-weight:600}
.exgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(48px,1fr));gap:6px;margin-top:14px}
.excell{font:inherit;padding:10px 0;border:2px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);cursor:pointer}
.excell.on{background:var(--ink);border-color:var(--ink);color:var(--paper)}
pre.out{white-space:pre-wrap;word-break:break-word;font:inherit;font-size:.92rem;background:var(--surface);
  border:1px dashed var(--line);border-radius:10px;padding:14px;margin:14px 0 0;user-select:text;-webkit-user-select:text}
.copied{color:var(--ok);font-weight:600;margin:10px 0 0;min-height:1.4em}.copied.fail{color:var(--grid)}
@media (prefers-reduced-motion:no-preference){.opt,.self,.chip,.blank{transition:background .12s,border-color .12s}}
</style>
</head>
<body>
<main id="app"></main>

<script>
/* =================================================================
   ✏️ 구글 시트 연결
   Apps Script를 '웹 앱'으로 배포한 뒤 받은 주소를 따옴표 안에 붙여넣으세요.
   비워 두면 시트로 보내지 않고, 휴대폰 저장 + 결과 복사만 작동해요.
   ================================================================= */
const SHEET_URL = "https://script.google.com/macros/s/AKfycbzxBY69jTxPYHJR32iAoBHCIO2LRLFTD9vl-dhe9fuKA1-6SQLD7fWPKbE9J5eX_WTU4Q/exec";
const APP_VERSION = "2026-10-11 R5";

/* =================================================================
   ✏️ 과 데이터 — 새 과를 추가할 때는 LESSONS 에 하나를 더 넣으면 됩니다.
   words     : 번호|어휘|쉬운 한국어 뜻
   sentences : 번호|3단계 문장|오답 재학습용 새 문장   (___ = 빈칸)
   groups    : 2단계에서 서로 헷갈리는 보기로 쓸 어휘 묶음 (쉼표로 구분)
   conflicts : 같은 3단계 보기에 함께 넣으면 정답이 둘이 될 수 있는 짝
   ================================================================= */
const LESSONS = [{
  code: "L1",
  title: "1과 적성과 진로",
  days: [{ day: 1, from: 1, to: 50 }, { day: 2, from: 51, to: 100 }],
  words: `
1|능력|어떤 일을 할 수 있는 힘
2|적성|어떤 일이 자기 성격이나 능력에 잘 맞는 것
3|소질|태어날 때부터 가지고 있어서 어떤 일을 잘할 가능성이 있는 능력
4|진로|앞으로 공부하거나 일할 방향
5|전공|대학에서 중심으로 공부하는 분야
6|분야|일이나 공부를 나눈 종류
7|장점|다른 사람보다 잘하거나 좋은 점
8|손재주|손으로 만들거나 고치는 일을 잘하는 능력
9|손재주가 좋다|손으로 만들거나 고치는 일을 잘하다
10|설득력|다른 사람이 내 말을 믿고 받아들이게 하는 힘
11|설득력이 있다|다른 사람이 내 말을 잘 받아들이게 할 수 있다
12|책임감|맡은 일을 끝까지 하려는 마음
13|책임감이 강하다|맡은 일을 끝까지 잘하려고 하다
14|이해가 빠르다|새로운 내용을 빨리 알아듣다
15|소질이 있다|어떤 일을 잘할 수 있는 타고난 능력이 있다
16|적성에 맞다|일이 자기 성격이나 능력과 잘 맞다
17|진로를 정하다|앞으로 공부하거나 일할 방향을 정하다
18|전공을 살리다|대학에서 공부한 것을 일할 때 사용하다
19|예술적|음악이나 미술 같은 예술의 느낌이 있는
20|실용적|실제 생활에서 사용하기에 좋은
21|사교적|사람들과 쉽게 친해지고 잘 어울리는
22|적극적|스스로 먼저 나서서 행동하는
23|긍정적|좋은 쪽으로 생각하는
24|활발하다|행동을 많이 하고 밝고 적극적이다
25|성실하다|해야 할 일을 꾸준히 열심히 하다
26|꼼꼼하다|작은 부분까지 자세히 살피다
27|음감|음악의 소리나 높낮이를 잘 느끼는 능력
28|음감이 뛰어나다|음악의 소리나 높낮이를 아주 잘 알다
29|패션 감각|옷을 잘 선택하고 어울리게 입는 능력
30|리더십|다른 사람들을 잘 이끌어 가는 능력
31|관심|어떤 것을 알고 싶거나 하고 싶은 마음

  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k === "class") e.className = v;
    else if (k === "text") e.textContent = v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else if (k === "disabled" || k === "hidden") e[k] = !!v;
    else e.setAttribute(k, v === true ? "" : v);
  }
  kids.flat().forEach(c => { if (c != null && c !== false) e.append(c.nodeType ? c : String(c)); });
  return e;
}

/* ---------- 데이터 준비 ---------- */
function prepare(L) {
  const W = {};
  lines(L.words).forEach(l => { const [no, word, desc] = l.split("|"); W[+no] = { no: +no, word, desc }; });
  lines(L.sentences).forEach(l => { const [no, a, b] = l.split("|"); if (W[+no]) W[+no].sent = [a, b]; });
  const byWord = {}; Object.values(W).forEach(w => byWord[w.word] = w.no);
  const groups = lines(L.groups).map(l => l.split(",").map(s => byWord[s.trim()]).filter(Boolean));
  const conflicts = lines(L.conflicts).map(l => l.split(",").map(s => byWord[s.trim()]).filter(Boolean));
  // 복습: 앞 과의 어휘와 뜻을 그대로 가져옴 (code|어휘)
  const RV = L.review ? lines(L.review).map((l, i) => {
    const [code, word] = l.split("|"), src = LESSONS.find(x => x.code === code);
    const ln = lines(src.words).find(x => x.split("|")[1] === word) || "";
    return { i, code, word, desc: ln.split("|")[2] || "", src: src.title.split(" ")[0] };
  }) : null;
  return { ...L, W, groups, conflicts, RV, short: L.title.split(" ")[0] };
}

async function callSheet(method, params, body) {
  if (!SHEET_URL) throw new Error("no_url");
  const ctrl = ("AbortController" in window) ? new AbortController() : null;
  const timer = ctrl ? setTimeout(() => ctrl.abort(), 20000) : null;
  try {
    const url = method === "GET" ? SHEET_URL + "?" + new URLSearchParams(params).toString() : SHEET_URL;
    const res = await fetch(url, method === "GET" ? { signal: ctrl && ctrl.signal }
      : { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(body), signal: ctrl && ctrl.signal });
    return await res.json();
  } finally { if (timer) clearTimeout(timer); }
}

    `${["①", "②", "③"][k]} ${L.RV[i].word}`)));

/* =================================================================
   2단계 — 쉬운 뜻 보고 어휘 찾기 (3지선다, 사이클마다 10문제)
   ================================================================= */
function makeOptions(no, avoid) {
  const pool = studiedNos();
  let tries = 0, opts;
  do {
    const conf = shuffle([...new Set(L.groups.filter(g => g.includes(no)).flat())].filter(x => x !== no && pool.includes(x)));
    let pick = conf.slice(0, 2);
    if (pick.length < 2) pick = pick.concat(shuffle(pool.filter(x => x !== no && !pick.includes(x) && posOf(wd(x)) === posOf(wd(no))))).slice(0, 2);
    if (pick.length < 2) pick = pick.concat(shuffle(pool.filter(x => x !== no && !pick.includes(x)))).slice(0, 2);
    opts = shuffle([no, ...pick]);
    tries++;
  } while (avoid && tries < 6 && avoid.slice().sort().join() === opts.slice().sort().join());
  if (avoid && avoid.join() === opts.join()) opts = shuffle(opts);
  return opts;
}
function startS2() {
  C().s2.queue = shuffle(cycleNos()).map(no => ({ no, options: makeOptions(no) }));
  C().s2.idx = 0;
  to("s2");
}

/* =================================================================
   3단계 — 문장 속 어휘 (보기 6개 + 문제 5개, 사이클마다 1세트)
   ================================================================= */
function priority(no) {
  const e = R.s1.entries[no] || {}, f = R.s2.first[no], r = R.s2.retry[no];
  let p = 0;
  if (r && !r.ok) p += 8;          // 다시 풀기에서도 틀림
  if (f && !f.ok) p += 4;          // 2단계 1차에서 틀림
  if (e.self === "new") p += 2;    // 처음 보는 단어
  if (e.self === "seen") p += 1;   // 본 적 있지만 잘 모름
  return p;
}
const conflictWith = (a, b) => L.conflicts.some(c => c.includes(a) && c.includes(b));

function makeBanks(nos, sentIdx, exclude) {
  const k = Math.ceil(nos.length / BANK_SIZE);
  const sizes = Array.from({ length: k }, (_, i) => Math.min(BANK_SIZE, nos.length - i * BANK_SIZE));
  const banks = Array.from({ length: k }, () => []);
  shuffle(nos).forEach(no => {
    let b = banks.findIndex((bk, i) => bk.length < sizes[i] && !bk.some(x => conflictWith(x, no)));
    if (b < 0) b = banks.findIndex((bk, i) => bk.length < sizes[i]);
    banks[b].push(no);
  });
  const all = studiedNos(), used = new Set([...nos, ...(exclude || [])]);
  return banks.map(items => {
    const conf = shuffle([...new Set(L.groups.filter(g => g.some(x => items.includes(x))).flat())]);
    const ok = x => !used.has(x) && all.includes(x) && !items.some(i => conflictWith(i, x));
    let d = conf.find(ok);
    if (d == null) d = shuffle(cycleNos()).find(ok);
    if (d == null) d = shuffle(all).find(ok);
    if (d == null) d = shuffle(all).find(x => !items.includes(x));
    used.add(d);
    return { items: shuffle(items), extra: d, words: shuffle([...items, d]), sent: sentIdx };
  });
}

/* 3단계에 낼 어휘 고르기: 어려운 것부터, 단 서로 바꿔 넣어도 말이 되는 짝(conflicts)은 함께 고르지 않음 */
function pickTargets() {
  const ranked = shuffle(cycleNos()).sort((a, b) => priority(b) - priority(a));
  const picked = [];
  for (const no of ranked) {
    if (picked.length >= S3_COUNT) break;
    if (!picked.some(x => conflictWith(x, no))) picked.push(no);
  }
  for (const no of ranked) if (picked.length < S3_COUNT && !picked.includes(no)) picked.push(no);   // 혹시 모자라면 채움
  return picked;
}

function startS3() {
  const S = C().s3;
  S.targets = pickTargets();
  S.banks = makeBanks(S.targets, 0);
  S.fills = S.banks.map(b => b.items.map(() => null));
  S.checked = S.banks.map(() => false);
  S.bi = 0;
  to("s3");
}

/* ---------- 어미 붙이기 (빈칸에 들어간 어휘를 문장에 맞게 바꿔 보여 줌) ---------- */
const SB = 0xAC00;
const dec = ch => { const c = ch ? ch.charCodeAt(0) - SB : -1; return c < 0 || c > 11171 ? null : { cho: Math.floor(c / 588), jung: Math.floor((c % 588) / 28), jong: c % 28 }; };
const com = (cho, jung, jong) => String.fromCharCode(SB + cho * 588 + jung * 28 + jong);
const BIEUP = ["두렵", "어렵", "쉽", "무섭", "가깝", "즐겁", "반갑", "귀엽", "가렵", "어지럽", "고급스럽", "무겁", "아쉽", "아깝",
  "여성스럽", "사랑스럽", "자랑스럽", "당황스럽", "걱정스럽", "남자답", "흥미롭",   // 4과
  "가볍", "안타깝", "뜨겁",                                                       // 5과
  "흥겹",                                                                         // 6과
  "괴롭", "부담스럽",     // 복습 2
  "정겹",                // 8과
  "자연스럽", "정의롭",   // 10과
  "해롭",                // 12과
  "번거롭", "미끄럽", "명예롭", "평화롭"];   // 15과   (ㅂ 불규칙)
const BRIGHT = [0, 8];   // ㅏ, ㅗ
function formA(stem) {                        // -아/어
  const L = stem.slice(-1), pre = stem.slice(0, -1), d = dec(L);
  if (!d) return stem + "어";
  if (L === "하") return pre + "해";
  if (d.jong === 17 && BIEUP.includes(stem)) return pre + com(d.cho, d.jung, 0) + "워";
  if (L === "르" && pre) { const p = dec(pre.slice(-1)); return pre.slice(0, -1) + com(p.cho, p.jung, 8) + (BRIGHT.includes(p.jung) ? "라" : "러"); }
  if (d.jong) return stem + (BRIGHT.includes(d.jung) ? "아" : "어");
  const merge = { 0: 0, 4: 4, 1: 1, 5: 5, 6: 6, 8: 9, 13: 14, 20: 6, 11: 10, 18: 4 };   // 6: 펴 → 펴
  return merge[d.jung] != null ? pre + com(d.cho, merge[d.jung], 0) : stem + "어";
}
function formPast(stem) { const a = formA(stem), d = dec(a.slice(-1)); return a.slice(0, -1) + com(d.cho, d.jung, 20); }
function formJong(stem, jong) {               // -(으)ㄴ / -(으)ㄹ
  const L = stem.slice(-1), pre = stem.slice(0, -1), d = dec(L);
  if (d && d.jong === 17 && BIEUP.includes(stem)) return pre + com(d.cho, d.jung, 0) + com(11, 13, jong);   // 두려운
  if (d && d.jong) return stem + (jong === 4 ? "은" : "을");
  return d ? pre + com(d.cho, d.jung, jong) : stem;
}
function formEu(stem) {                       // -(으)면, -(으)려고, -(으)셨어요
  const L = stem.slice(-1), pre = stem.slice(0, -1), d = dec(L);
  if (d && d.jong === 17 && BIEUP.includes(stem)) return pre + com(d.cho, d.jung, 0) + "우";
  return d && d.jong ? stem + "으" : stem;
}
const cutAt = s => { const m = s.search(/[\s.,?!']/); return m < 0 ? s.length : m; };

/* 어휘 no 를 tail(빈칸 뒤 글자) 앞에 넣었을 때 → { main: 빈칸에 보일 말, rest: 뒤에 남는 글자, mismatch } */
function fitWord(no, tail) {
  const word = wd(no), pos = posOf(word);
  if (tail.startsWith("-")) {
    if (pos !== "pred") return { main: word, rest: tail, mismatch: true };
    const sp = word.lastIndexOf(" "), prefix = sp >= 0 ? word.slice(0, sp + 1) : "", stem = word.slice(sp + 1, -1);
    const t = tail.slice(1); let s;
    if (t.startsWith("아요/어요")) s = formA(stem) + "요" + t.slice(5);
    else if (t.startsWith("아/어")) s = formA(stem) + t.slice(3);
    else if (t.startsWith("았/었")) s = formPast(stem) + t.slice(3);
    else if (t.startsWith("(으)")) { const r = t.slice(3); s = (r[0] === "ㄴ" || r[0] === "ㄹ") ? formJong(stem, r[0] === "ㄴ" ? 4 : 8) + r.slice(1) : formEu(stem) + r; }
    else s = stem + t;
    const c = cutAt(s);
    return { main: prefix + s.slice(0, c), rest: s.slice(c) };
  }
  if (pos === "pred") return { main: word, rest: tail, mismatch: true };
  const d = dec(word.slice(-1)), b = !!(d && d.jong), isL = !!(d && d.jong === 8);
  for (const [k, x, y] of [["을/를", "을", "를"], ["이/가", "이", "가"], ["은/는", "은", "는"], ["과/와", "과", "와"]])
    if (tail.startsWith(k)) return { main: word + (b ? x : y), rest: tail.slice(k.length) };
  if (tail.startsWith("(으)로")) return { main: word + (b && !isL ? "으로" : "로"), rest: tail.slice(4) };
  if (tail.startsWith("(이)")) { const r = tail.slice(3), c = cutAt(r); return { main: word + (b ? "이" : "") + r.slice(0, c), rest: r.slice(c) }; }
  if (tail.startsWith("이에요")) return { main: word + (b ? "이에요" : "예요"), rest: tail.slice(3) };
  return { main: word, rest: tail };
}


/* ---------- 3단계 화면: 끌어서 놓기 + 누르기 ---------- */
function renderBank(mode) {
  const isRetry = mode === "retry";
  const S = C().s3;
  const banks = isRetry ? S.rbanks : S.banks;
  const bi = isRetry ? S.rbi : S.bi;
  const fills = (isRetry ? S.rfills : S.fills)[bi];
  const checkedArr = isRetry ? S.rchecked : S.checked;
  const rec = isRetry ? R.s3.retry : R.s3.first;
  const bank = banks[bi], checked = checkedArr[bi];
  let active = -1;   // 처음에는 어느 빈칸도 미리 고르지 않음

  const bankBox = h("div", { class: "bank", role: "group", "aria-label": "보기" });
  const list = h("ol", { class: "sents" });
  const checkBtn = h("button", { type: "button", class: "btn" });
  const note = h("p", { class: "muted small", style: "margin:10px 0 0" });

  /* 놓기/누르기 동작 */
  function placeWord(no, j) { const k = fills.indexOf(no); if (k >= 0) fills[k] = null; fills[j] = no; }
  function commit() { active = -1; save(); draw(); }
  function tapChip(no) {
    if (active < 0) active = fills.findIndex(f => f == null);
    if (active < 0) return;
    placeWord(no, active); commit();
  }
  function tapBlank(i) { if (fills[i] != null) { fills[i] = null; save(); } active = i; draw(); }
  function drop(src, target) {
    if (target.blank != null) {
      const j = target.blank;
      if (src.chip != null) placeWord(src.chip, j);
      else if (src.blank != null && src.blank !== j) [fills[src.blank], fills[j]] = [fills[j], fills[src.blank]];
    } else if (target.bank && src.blank != null) fills[src.blank] = null;
    commit();
  }

  /* 손가락/마우스로 끌기 */
  let drag = null;
  function hitTest(x, y) {
    const el = document.elementFromPoint(x, y);
    const b = el && el.closest(".blank");
    if (b && b.dataset.i != null) return { blank: +b.dataset.i, el: b };
    const bk = el && el.closest(".bank");
    return bk ? { bank: true, el: bk } : {};
  }
  function clearOver() { document.querySelectorAll(".over").forEach(e => e.classList.remove("over")); }
  function bindDrag(el, src, onTap) {
    el.addEventListener("pointerdown", e => {
      if (checked || (e.pointerType === "mouse" && e.button !== 0)) return;
      const labelNo = src.chip != null ? src.chip : fills[src.blank];
      drag = { src, el, x0: e.clientX, y0: e.clientY, moved: false, ghost: null, label: labelNo != null ? wd(labelNo) : null };
      try { el.setPointerCapture(e.pointerId); } catch (_) {}
    });
    el.addEventListener("pointermove", e => {
      if (!drag || drag.el !== el) return;
      if (!drag.moved && drag.label != null && Math.hypot(e.clientX - drag.x0, e.clientY - drag.y0) > 8) {   // 빈 빈칸은 끌 수 없고 누르기만
        drag.moved = true;
        drag.ghost = h("div", { class: "dragghost" }, drag.label); document.body.append(drag.ghost);
        el.classList.add("dragging");
      }
      if (!drag.moved) return;
      e.preventDefault();
      drag.ghost.style.left = e.clientX + "px"; drag.ghost.style.top = e.clientY + "px";
      clearOver(); const t = hitTest(e.clientX, e.clientY);
      if (t.el && !(t.bank && src.chip != null)) t.el.classList.add("over");
      if (e.clientY > innerHeight - 70) scrollBy(0, 14); else if (e.clientY < 70) scrollBy(0, -14);
    });
    const end = (e, cancel) => {
      if (!drag || drag.el !== el) return;
      const d = drag; drag = null;
      if (d.ghost) d.ghost.remove(); el.classList.remove("dragging"); clearOver();
      if (cancel) return;
      if (!d.moved) onTap(); else drop(d.src, hitTest(e.clientX, e.clientY));
    };
    el.addEventListener("pointerup", e => end(e, false));
    el.addEventListener("pointercancel", e => end(e, true));
    el.addEventListener("click", e => { if (e.detail === 0) onTap(); });   // 키보드(Enter/Space)로 누를 때
  }

  function draw() {
    bankBox.innerHTML = ""; list.innerHTML = "";
    bank.words.forEach(no => {
      const usedAt = fills.indexOf(no);
      const cls = "chip" + (usedAt >= 0 && !checked ? " used" : "") + (checked && no === bank.extra ? " unused" : "");
      const chip = h("button", { type: "button", class: cls, disabled: checked }, wd(no));
      bindDrag(chip, { chip: no }, () => tapChip(no));
      bankBox.append(chip);
    });
    bank.items.forEach((no, i) => {
      const [before, tail] = L.W[no].sent[bank.sent].split("___");
      const filled = fills[i] != null, ok = filled && fills[i] === no;
      const fit = filled ? fitWord(fills[i], tail) : null;
      let cls = "blank";
      if (checked) cls += ok ? " ok" : " no";
      else if (i === active) cls += " active";
      const blank = h("button", { type: "button", class: cls, disabled: checked, "data-i": i,
        "aria-label": `${i + 1}번 빈칸${filled ? ": " + fit.main : ""}` }, filled ? fit.main : " ");
      if (!checked) bindDrag(blank, { blank: i }, () => tapBlank(i));
      const li = h("li", { class: checked ? (ok ? "ok" : "no") : "" },
        h("span", { class: "n" }, `${i + 1}`), " ", before, blank,
        filled && !fit.mismatch ? fit.rest : h("span", { class: "gram" }, tail));
      if (checked) li.append(...[].concat(ok
        ? h("span", { class: "mark ok" }, `✅ ${fit.main}`)
        : [h("span", { class: "mark no" }, "❌ 틀렸어요"),
           (() => { const right = fitWord(no, tail);           // 정답이 들어간 완성 문장
             return h("div", { class: "answer" }, h("span", { class: "answer-t" }, "✅ 정답 문장"),
               h("p", {}, before, h("span", { class: "ans" }, right.main), right.rest)); })(),
           h("span", { class: "pair" }, "내가 고른 답: ", h("b", {}, wd(fills[i])), "  →  맞는 어휘: ", h("b", { class: "ok" }, wd(no)))]));
      list.append(li);
    });
    const full = fills.every(f => f != null), last = bi === banks.length - 1;
    if (!checked) {
      checkBtn.textContent = "정답 확인"; checkBtn.disabled = !full;
      note.textContent = full ? "다 채웠어요. 정답을 확인하세요." : "보기를 끌어서 빈칸에 놓으세요. 빈칸을 먼저 누르고 보기를 눌러도 돼요. 한 어휘는 쓰지 않아요.";
    } else {
      const right = bank.items.filter((no, i) => fills[i] === no).length;
      checkBtn.disabled = false; checkBtn.textContent = last ? (isRetry ? "CYCLE 결과 보기" : "결과 보기") : "다음 문제";
      note.textContent = `${right}/${bank.items.length} 맞았어요. 쓰지 않는 어휘: ${wd(bank.extra)}`;
    }
  }
  checkBtn.addEventListener("click", () => {
    if (!checked) {
      if (!fills.every(f => f != null)) return;
      bank.items.forEach((no, i) => rec[no] = { pick: fills[i], ok: fills[i] === no, sentence: bank.sent, at: Date.now() });
      checkedArr[bi] = true; save(); renderBank(mode); return;
    }
    const last = bi === banks.length - 1;
    if (isRetry) { if (last) finishCycle(); else { S.rbi++; save(); renderBank(mode); } }
    else { if (last) to("s3sum"); else { S.bi++; save(); renderBank(mode); } }
  });

  const totalItems = banks.reduce((s, b) => s + b.items.length, 0);
  const doneItems = banks.slice(0, bi).reduce((s, b) => s + b.items.length, 0) + (checked ? bank.items.length : 0);
  screen(
    head(isRetry ? "3단계 새 문장으로 다시 풀기" : "3단계 문장 속 어휘", doneItems, totalItems),
    h("p", { class: "muted small", style: "margin:0 0 4px" }, "빈칸에 알맞은 어휘를 넣으세요. 넣으면 문장에 맞는 모양으로 바뀌어요."),
    bankBox, list, note, checkBtn
  );
  draw();
}

/* =================================================================
   어휘별 이력과 분류
   ================================================================= */
function journey(no) {
  const steps = [];
  if (R.s2.first[no]) steps.push({ label: "2단계", ok: R.s2.first[no].ok });
  if (R.s2.retry[no]) steps.push({ label: "2단계 다시", ok: R.s2.retry[no].ok });
  if (R.s3.first[no]) steps.push({ label: "3단계", ok: R.s3.first[no].ok });
  if (R.s3.retry[no]) steps.push({ label: "3단계 다시", ok: R.s3.retry[no].ok });
  return steps;
}
/* 한 번이라도 틀린 어휘만: 마지막 시도에서 맞혔으면 🟡 복습 권장, 마지막에도 틀렸으면 🔴 집중 복습 */
function classify(nos) {
  const yellow = [], red = [], status = {};
  nos.forEach(no => {
    const steps = journey(no);
    if (!steps.some(s => !s.ok)) return;
    const kind = steps[steps.length - 1].ok ? "yellow" : "red";
    (kind === "yellow" ? yellow : red).push(no);
    status[no] = { kind, steps };
  });
  return { yellow, red, status };
}

/* 여러 사이클을 단계별로 합산 */
function stageTotals(cycles) {
  const t = { n: 0, native: 0, know: 0, seen: 0, new: 0,
              s2: 0, s2ok: 0, s2r: 0, s2rok: 0, s3: 0, s3ok: 0, s3r: 0, s3rok: 0 };
  cycles.forEach(cy => {
    cy.nos.forEach(no => {
      const e = R.s1.entries[no] || {};
      t.n++; if (e.native && e.native.trim()) t.native++; if (e.self) t[e.self]++;
    });
    cy.s2.queue.forEach(q => { t.s2++; if (R.s2.first[q.no] && R.s2.first[q.no].ok) t.s2ok++; });
    cy.s2.rqueue.forEach(q => { t.s2r++; if (R.s2.retry[q.no] && R.s2.retry[q.no].ok) t.s2rok++; });
    cy.s3.targets.forEach(no => { t.s3++; if (R.s3.first[no] && R.s3.first[no].ok) t.s3ok++; });
    cy.s3.rbanks.flatMap(b => b.items).forEach(no => { t.s3r++; if (R.s3.retry[no] && R.s3.retry[no].ok) t.s3rok++; });
  });
  return t;
}

/* =================================================================
   사이클 완료

function finishCycle() {
  const cy = C(), t = stageTotals([cy]), rv = classify(cy.nos);
  cy.summary = {                          // 교사용 대시보드를 위한 사이클별 기록
    cycle: R.cycle + 1, words: rangeText(cy.nos), finishedAt: Date.now(),
    s1: { done: t.native, total: t.n, know: t.know, seen: t.seen, new: t.new },
    s2: { first: t.s2ok, total: t.s2, retry: t.s2rok, retryTotal: t.s2r },
    s3: { first: t.s3ok, total: t.s3, retry: t.s3rok, retryTotal: t.s3r },
    yellow: rv.yellow, red: rv.red

}

const minutes = () => Math.max(1, Math.round((R.activeSeconds || 0) / 60));

/* =================================================================
   예습 결과 → 구글 시트 (휴대폰 저장과 함께, 실패해도 기록은 그대로)

function buildPayload() {
  const t = stageTotals(R.cycles), rv = classify(dayNos()), words = a => a.map(wd);

      s1_done: t.native, s1_total: t.n, know: t.know, seen: t.seen, new: t.new,
      s2_first: t.s2ok, s2_total: t.s2, s2_first_wrong: words(s2wrong), s2_retry_ok: t.s2rok, s2_retry_total: t.s2r, s2_unresolved: words(s2unres),

      yellow: words(rv.yellow), red: words(rv.red), minutes: minutes(),

      cycles: R.cycles.map(cy => cy.summary && { ...cy.summary, yellow: words(cy.summary.yellow), red: words(cy.summary.red) })

let sending = false;
async function submitPrestudy(onChange) {
  if (!SHEET_URL || !R || !R.completed || sending) return;
  if (!R.sync) R.sync = { submissionId: uuid(), status: "pending", attempts: 0 };
  if (R.sync.status === "ok") return;
  const rec = R, key = KEY;                      // 보내는 동안 화면이 바뀌어도 이 기록에 저장
  sending = true; rec.sync.status = "sending"; rec.sync.attempts++; store.set(key, rec); onChange && onChange();
  try {
    const r = await callSheet("POST", null, buildPayload());
    if (r && r.ok) { rec.sync.status = "ok"; rec.sync.receivedAt = r.received_at || null; rec.sync.lastError = null; }
    else { rec.sync.status = "fail"; rec.sync.lastError = (r && r.error) || "unknown"; }
  } catch (e) {
    rec.sync.status = "fail"; rec.sync.lastError = e.name === "AbortError" ? "timeout" : "network";
  }
  sending = false; store.set(key, rec); onChange && onChange();
}

    h("p", { class: "kind" }, "② 뜻 → 어휘"),
    h("div", { class: "stats" },
      row("1차 총점", `${t.s2ok}/${t.s2}`),
      row("오답", `${t.s2 - t.s2ok}개`),
      row("오답 재학습", t.s2r ? `${t.s2rok}/${t.s2r}` : "없음"),
      row("최종 미해결", `${t.s2r - t.s2rok}개`)),

    h("p", { class: "kind" }, "③ 문맥 속 어휘"),
    h("div", { class: "stats" },
      row("1차 총점", `${t.s3ok}/${t.s3}`),
      row("오답 재학습", t.s3r ? `${t.s3rok}/${t.s3r}` : "없음"),
      row("최종 미해결", `${t.s3r - t.s3rok}개`)),

    h("div", { class: "stats", style: "margin-top:22px" },
      row("🟡 복습 권장", `${rv.yellow.length}개`),
      row("🔴 집중 복습", `${rv.red.length}개`),
      row("학습시간", `${minutes()}분`)),

    h("p", { class: "kind", style: "margin-top:28px" }, SHEET_URL ? "결과 복사 (자동 제출이 안 될 때만)" : "선생님께 보낼 결과"),
    h("button", { type: "button", class: "btn", onclick: async () => {
      const ok = await copyText(text);
      msg.className = "copied" + (ok ? "" : " fail");
      msg.textContent = ok ? "복사했어요. 카카오톡에 붙여넣어 보내세요." : "자동 복사가 안 돼요. 아래 글을 길게 눌러 복사하세요.";
    } }, "결과 복사"),
    msg,
    h("pre", { class: "out" }, text),

    rv.red.length ? [h("p", { class: "kind" }, `🔴 집중 복습 ${rv.red.length}개`),
      h("p", { class: "muted small" }, "마지막까지 틀린 어휘예요. 수업 전에 뜻을 한 번 더 보세요."), journeyList(rv.red, rv)] : null,
    rv.yellow.length ? [h("p", { class: "kind" }, `🟡 복습 권장 ${rv.yellow.length}개`),
      h("p", { class: "muted small" }, "처음에는 틀렸지만 다시 공부해서 맞힌 어휘예요."), journeyList(rv.yellow, rv)] : null,
    h("button", { type: "button", class: "btn", style: "margin-top:28px", onclick: () => renderVocab("final") }, "📒 나의 어휘장 열기"),
    h("p", { class: "muted small", style: "margin:8px 0 0" }, "오늘 공부한 50개를 모아 보고, 가리고 복습할 수 있어요. 점수와 학습시간에는 들어가지 않아요."),
    h("button", { type: "button", class: "btn ghost", style: "margin-top:14px", onclick: renderStart }, "처음 화면으로")
  );
}

/* =================================================================
   📝 시험 (5단계)
   · 문제는 앱에 없고, 시험 코드를 넣으면 서버(시험문항 탭)에서 받아 옴
   · 10분 타이머는 시작 시각 기준으로 계속 흐름 (앱을 닫았다 열어도 이어짐)
   · 시험 중에는 시험 화면만 보임 (어휘장, 예습 화면 잠금)
   · 점수는 서버가 다시 채점해서 저장, 1차 점수는 오답 재시험과 따로 기록
   ================================================================= */
const EXAM_SECONDS = 600;
const EXAM_ACTIVE = "prestudy:v3:exam:active";
const examDoneKey = (lesson, day, id) => `prestudy:v3:exam:done:${lesson}:${day}:${id}`;
let E = null, examTimer = null, qShownAt = 0;
const examActive = () => store.get(EXAM_ACTIVE);
const saveExam = () => { if (E) store.set(EXAM_ACTIVE, E); };
const mmss = s => { s = Math.max(0, Math.ceil(s)); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`; };
const remaining = () => EXAM_SECONDS - (Date.now() - E.startedAt) / 1000;

/* ---------- 들어가기: 학생 번호 + 시험 코드 ---------- */
function renderExamEntry(target) {
  if (examActive()) { E = examActive(); return renderExam(); }
  const { lesson, day } = target;
  const idIn = h("input", { type: "text", id: "ex-id", autocomplete: "off", autocapitalize: "characters", spellcheck: "false", placeholder: "예: 4A-01" });
  idIn.value = target.id || "";
  const codeIn = h("input", { type: "text", id: "ex-code", autocomplete: "off", inputmode: "numeric", maxlength: "6", placeholder: "칠판의 숫자" });
  const err = h("p", { class: "err", role: "alert" });
  const btn = h("button", { type: "button", class: "btn", style: "margin-top:22px" }, "시험 시작");
  const who = h("p", { class: "hint", style: "margin-top:6px" });
  const showWho = () => { const i = knownStudent(normId(idIn.value)); who.textContent = i && i.name ? `${i.name} · ${i.cls}` : ""; };
  idIn.addEventListener("input", showWho); showWho();

  btn.addEventListener("click", async () => {
    const id = normId(idIn.value), code = codeIn.value.trim();
    if (!id) { err.textContent = "학생 번호를 쓰세요."; return; }
    if (!code) { err.textContent = "시험 코드를 쓰세요."; return; }
    if (!SHEET_URL) { err.textContent = "시험은 학교에서 받은 링크에서만 볼 수 있어요."; return; }
    btn.disabled = true; btn.textContent = "시험을 준비하고 있어요…"; err.textContent = "";
    try {
      const r = await callSheet("POST", null, { action: "exam_start", student_id: id, code, lesson_code: lesson.code, day, app_version: APP_VERSION });
      if (!r.ok) {
        btn.disabled = false; btn.textContent = "시험 시작";
        err.textContent = ({
          bad_code: "시험 코드가 맞지 않아요. 칠판의 코드를 다시 확인하세요.",
          not_found: "명단에 없는 번호예요. 선생님께 확인하세요.",
          wrong_class: "우리 반 시험 코드가 아니에요. 칠판의 코드를 다시 확인하세요.",
          wrong_day: `이 코드는 ${(r.lesson_title || "").split(" ")[0]} DAY ${r.day} 시험 코드예요. 오늘 시험 DAY를 다시 확인하세요.`,
          no_items: "이 시험의 문제가 아직 준비되지 않았어요. 선생님께 알려 주세요.",
          already_taken: `이미 본 시험이에요. (1차 ${r.score}/${r.total}) 다시 보려면 선생님께 말씀하세요.`
        })[r.error] || "시험을 시작하지 못했어요. 다시 눌러 보세요.";
        return;
      }
      rememberStudent(r.student.id, { name: r.student.name, cls: r.student.cls });
      store.set("prestudy:v3:last", { ...(store.get("prestudy:v3:last") || {}), id: r.student.id });
      E = newExam(r); saveExam(); renderExam();
    } catch (e) {
      btn.disabled = false; btn.textContent = "시험 시작";
      err.textContent = "인터넷 연결을 확인하고 다시 눌러 주세요.";
    }
  });

  screen(
    h("button", { type: "button", class: "link", onclick: renderStart }, "← 처음 화면"),
    h("h2", { style: "margin-top:8px" }, `📝 ${lesson.title.split(" ")[0]} DAY ${day} 시험`),
    h("p", { class: "muted" }, "선생님이 알려 준 시험 코드를 넣으면 시작해요. 시간은 10분이에요."),
    h("label", { class: "f", for: "ex-id" }, "학생 번호"), idIn, who,
    h("label", { class: "f", for: "ex-code" }, "시험 코드"), codeIn,
    err, btn,
    h("p", { class: "hint" }, "시작하면 10분이 지나거나 제출할 때까지 다른 화면으로 갈 수 없어요.")
  );
}

function newExam(r) {
  const items = r.items.map(it => ({ ...it, opts: shuffle([it.answer, ...it.wrong]), ropts: shuffle([it.retry.answer, ...it.retry.wrong]) }));
  return {
    id: r.session_id, startedAt: Date.now(), serverStart: r.started_at, regular: r.regular,
    student: r.student, lesson: { code: r.lesson_code, title: r.lesson_title }, day: r.day,
    items: shuffle(items),                        // 학생마다 문제 순서도 섞음
    phase: "q", idx: 0, picks: {}, secs: {},
    wrong: [], ridx: 0, rpicks: {}, rsecs: {},
    firstAt: null, firstLocal: null, result: null, autoEnd: false,
    sync: { first: null, final: null }
  };
}

/* ---------- 타이머 ---------- */
function tick() {
  if (!E || E.phase === "done") { clearInterval(examTimer); examTimer = null; return; }
  const el = document.getElementById("ex-timer");
  const left = remaining();
  if (el) { el.textContent = mmss(left); el.classList.toggle("low", left <= 60); }
  if (left <= 0) timeUp();
}
function startTimer() { if (!examTimer) examTimer = setInterval(tick, 500); }
function noteTime() {                                 // 지금 보던 문제에 머문 시간 더하기
  if (!E || !qShownAt) return;
  const sec = (Date.now() - qShownAt) / 1000; qShownAt = 0;
  if (E.phase === "q") { const no = E.items[E.idx].no; E.secs[no] = (E.secs[no] || 0) + sec; }
  if (E.phase === "r") { const no = E.wrong[E.ridx]; E.rsecs[no] = (E.rsecs[no] || 0) + sec; }
}
async function timeUp() {
  if (!E || E.phase === "done") return;
  noteTime(); E.autoEnd = true;
  if (E.phase === "q") gradeFirst();
  await finishExam();
}

/* ---------- 화면 나누기 ---------- */
function renderExam() {
  if (!E) return renderStart();
  if (E.phase !== "done" && remaining() <= 0) { timeUp(); return; }
  if (E.phase === "q") return renderExamQ("q");
  if (E.phase === "firstdone") return renderFirstDone();
  if (E.phase === "r") return renderExamQ("r");
  if (E.phase === "done") return renderExamDone();
}
function examHead(label, done, total) {
  return h("div", { class: "exhead" },
    h("div", { class: "exrow" },
      h("span", {}, h("b", {}, `📝 ${E.lesson.title.split(" ")[0]} DAY ${E.day}`), ` · ${label}`),
      h("span", { class: "extimer", id: "ex-timer" }, mmss(remaining()))),
    h("div", { class: "bar", "aria-hidden": "true" }, h("i", { style: `width:${Math.round(done / total * 100)}%` })),
    h("p", { class: "muted small", style: "margin:6px 0 0" }, `답한 문제 ${done} / ${total}`));
}

/* ---------- 문제 화면 (1차, 재시험 같이 씀) ---------- */
function renderExamQ(mode) {
  const isR = mode === "r";
  const list = isR ? E.wrong.map(no => E.items.find(it => it.no === no)) : E.items;
  const picks = isR ? E.rpicks : E.picks;
  const i = isR ? E.ridx : E.idx, it = list[i];
  const done = list.filter(x => picks[x.no] != null).length;
  const prompt = isR ? it.retry.q : it.q, opts = isR ? it.ropts : it.opts;
  const isCtx = !isR && it.type === "문맥형";
  const go = k => { noteTime(); if (isR) E.ridx = k; else E.idx = k; saveExam(); renderExamQ(mode); };

  const box = h("div", { class: "opts", role: "group" });
  opts.forEach((o, k) => box.append(h("button", {
    type: "button", class: "opt", "aria-pressed": picks[it.no] === o ? "true" : "false",
    onclick: () => {
      picks[it.no] = o; saveExam();
      for (const b of box.children) b.setAttribute("aria-pressed", b.textContent.slice(2) === o ? "true" : "false");
      setTimeout(() => {                               // 다음 문제로 (모두 답했으면 목록으로)
        if (!E || E.phase !== mode) return;
        const next = list.findIndex((x, n) => n > i && picks[x.no] == null);
        const any = list.findIndex(x => picks[x.no] == null);
        if (next >= 0) go(next); else if (any >= 0) go(any); else { noteTime(); saveExam(); renderGrid(mode); }
      }, 280);
    }
  }, `${["①", "②", "③"][k]} ${o}`)));

  screen(
    examHead(isR ? "오답 재시험" : "1차 시험", done, list.length),
    h("p", { class: "qnum", style: "margin-top:18px" }, `${i + 1} / ${list.length}` + (isCtx ? " · 빈칸에 알맞은 말" : "")),
    h("p", { class: "prompt" }, prompt),
    h("p", { class: "muted small", style: "margin:-10px 0 16px" }, isCtx ? "빈칸에 들어갈 말을 고르세요." : "이 뜻에 맞는 어휘를 고르세요."),
    box,
    h("div", { class: "row", style: "margin-top:18px" },
      h("button", { type: "button", class: "btn ghost", disabled: i === 0, onclick: () => go(i - 1) }, "← 이전"),
      h("button", { type: "button", class: "btn ghost", onclick: () => { noteTime(); saveExam(); renderGrid(mode); } }, "문제 목록"),
      h("button", { type: "button", class: "btn ghost", disabled: i === list.length - 1, onclick: () => go(i + 1) }, "다음 →"))
  );
  qShownAt = Date.now(); startTimer(); tick();
}

/* ---------- 문제 목록 + 제출 ---------- */
function renderGrid(mode) {
  const isR = mode === "r";
  const list = isR ? E.wrong.map(no => E.items.find(it => it.no === no)) : E.items;
  const picks = isR ? E.rpicks : E.picks;
  const left = list.filter(x => picks[x.no] == null).length;
  const grid = h("div", { class: "exgrid" }, list.map((x, k) => h("button", {
    type: "button", class: "excell" + (picks[x.no] != null ? " on" : ""),
    onclick: () => { if (isR) E.ridx = k; else E.idx = k; saveExam(); renderExamQ(mode); }
  }, String(k + 1))));
  const submit = h("button", { type: "button", class: "btn", style: "margin-top:20px", onclick: async () => {
    if (left && !confirm(`아직 답하지 않은 문제가 ${left}개 있어요. 그래도 제출할까요?`)) return;
    if (isR) { await finishExam(); } else { gradeFirst(); saveExam(); sendExam("first"); renderExam(); }
  } }, isR ? "재시험 제출" : "1차 제출");
  screen(
    examHead(isR ? "오답 재시험" : "1차 시험", list.length - left, list.length),
    h("p", { class: "muted", style: "margin-top:16px" }, left ? `답하지 않은 문제가 ${left}개 있어요. 번호를 누르면 그 문제로 가요.` : "모든 문제에 답했어요. 제출 전에 다시 볼 수 있어요."),
    grid, submit
  );
  startTimer(); tick();
}

/* ---------- 채점 ---------- */
function gradeFirst() {
  E.wrong = E.items.filter(it => E.picks[it.no] !== it.answer).map(it => it.no);
  E.firstLocal = { score: E.items.length - E.wrong.length, total: E.items.length };
  E.firstAt = Date.now(); E.phase = "firstdone"; E.ridx = 0;
}
function renderFirstDone() {
  const f = E.firstLocal, left = remaining();
  if (!E.wrong.length) return finishExam();
  screen(
    examHead("1차 제출 완료", f.total, f.total),
    h("h2", { style: "margin-top:20px" }, "1차 시험 결과"),
    h("p", { class: "big" }, `${f.score}/${f.total}`),
    h("p", { class: "muted" }, `1차 제출까지 ${mmss((E.firstAt - E.startedAt) / 1000)} · 남은 시간 ${mmss(left)}`),
    h("p", { style: "margin-top:16px" }, `틀린 문제 ${E.wrong.length}개를 남은 시간 동안 다시 풀 수 있어요. 문제와 보기가 조금 바뀌어요.`),
    h("p", { class: "muted small" }, "다시 풀어서 맞혀도 1차 점수는 바뀌지 않아요."),
    h("button", { type: "button", class: "btn", style: "margin-top:18px", onclick: () => { E.phase = "r"; E.ridx = 0; saveExam(); renderExam(); } }, `오답 ${E.wrong.length}개 다시 풀기`),
    h("button", { type: "button", class: "btn ghost", onclick: () => { if (confirm("시험을 끝낼까요? 끝내면 다시 풀 수 없어요.")) finishExam(); } }, "시험 끝내기")
  );
  startTimer(); tick();
}

/* ---------- 마무리 + 전송 ---------- */
function examPayload(stage, ex) {
  const E = ex;
  const pickList = (order, picks, secs) => order.map(no => ({ no, pick: picks[no] == null ? "" : picks[no], sec: Math.round((secs[no] || 0) * 10) / 10 }));
  return { action: "exam_submit", session_id: E.id, stage, auto_end: E.autoEnd, app_version: APP_VERSION,
           first: pickList(E.items.map(it => it.no), E.picks, E.secs),
           retry: stage === "final" ? pickList(E.wrong, E.rpicks, E.rsecs) : [] };
}
async function sendExam(stage, exArg) {
  const ex = exArg || E; if (!ex) return;
  ex.sync[stage] = "sending"; store.set(ex.phase === "done" ? examDoneKey(ex.lesson.code, ex.day, ex.student.id) : EXAM_ACTIVE, ex);
  try {
    const r = await callSheet("POST", null, examPayload(stage, ex));
    ex.sync[stage] = r && r.ok ? "ok" : "fail";
    if (r && r.ok && stage === "final") ex.result = r;
  } catch (e) { ex.sync[stage] = "fail"; }
  store.set(ex.phase === "done" ? examDoneKey(ex.lesson.code, ex.day, ex.student.id) : EXAM_ACTIVE, ex);
  if (E === ex && ex.phase === "done") { const b = document.getElementById("ex-sync"); if (b) b.replaceWith(examSyncBox()); }
}
async function finishExam() {
  if (!E || E.phase === "done") return;
  noteTime();
  if (E.phase === "q") gradeFirst();
  E.phase = "done"; E.endedAt = Date.now();
  clearInterval(examTimer); examTimer = null;
  store.set(examDoneKey(E.lesson.code, E.day, E.student.id), E);
  store.del(EXAM_ACTIVE);                              // 잠금 풀기
  renderExamDone();
  await sendExam("final");
}
/* 보내지 못한 시험 결과가 있으면 앱을 열 때 다시 보내기 */
function resendPendingExams() {
  if (!SHEET_URL) return;
  try {
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      if (!k || !k.startsWith("prestudy:v3:exam:done:")) continue;
      const ex = store.get(k);
      if (ex && ex.sync && ex.sync.final !== "ok" && ex.sync.final !== "sending") sendExam("final", ex);
    }
  } catch (e) {}
}
function examSyncBox() {
  const st = E.sync.final;
  const box = h("div", { id: "ex-sync", class: "sync " + (st === "ok" ? "ok" : st === "fail" ? "fail" : "wait"), role: "status" });
  if (st === "ok") box.append(h("b", {}, "✅ 시험 결과가 제출되었습니다."));
  else if (st === "fail") box.append(h("b", {}, "⚠️ 결과를 보내지 못했어요."), h("span", {}, "인터넷 연결을 확인하고 다시 제출하세요. 결과는 이 휴대폰에 저장되어 있어요."),
    h("button", { type: "button", class: "btn", style: "margin-top:10px", onclick: () => sendExam("final") }, "다시 제출"));
  else box.append(h("b", {}, "⏳ 결과를 보내고 있어요…"));
  return box;
}
function renderExamDone() {
  const f = E.firstLocal || { score: 0, total: E.items.length };
  const rOk = E.wrong.filter(no => { const it = E.items.find(x => x.no === no); return E.rpicks[no] === it.retry.answer; }).length;
  const unresolved = E.wrong.filter(no => { const it = E.items.find(x => x.no === no); return E.rpicks[no] !== it.retry.answer; });
  const tried = Object.keys(E.rpicks).length > 0;
  const firstWrongItems = E.wrong.map(no => E.items.find(x => x.no === no));
  const text = [
    `📝 ${E.lesson.title.split(" ")[0]} DAY ${E.day} 시험 | ${E.student.name || ""} (${E.student.id})`,
    `1차 ${f.score}/${f.total}`,
    E.wrong.length ? `오답 재시험 ${tried ? rOk : 0}/${E.wrong.length}` : "오답 없음",
    unresolved.length ? `미해결: ${unresolved.map(no => E.items.find(x => x.no === no).word).join(" · ")}` : "",
    E.regular ? "" : "정규시간 외 응시",
    E.autoEnd ? "10분 종료로 자동 제출" : "",
    `시험 ID: ${E.id.slice(0, 8)}`
  ].filter(Boolean).join("\n");
  const msg = h("p", { class: "copied", role: "status" });
  screen(
    h("h2", {}, "📝 시험 완료"),
    h("p", { class: "muted" }, `${E.lesson.title} / DAY ${E.day} · ${E.student.name || ""} (${E.student.id})`),
    examSyncBox(),
    h("div", { class: "stats" },
      row("1차 점수", `${f.score}/${f.total}`),
      row("오답 재시험", E.wrong.length ? `${tried ? rOk : 0}/${E.wrong.length}` : "없음"),
      row("최종 미해결", `${unresolved.length}개`),
      row("응시", E.regular ? "정규시간" : "정규시간 외")),
    E.autoEnd ? h("p", { class: "muted small", style: "margin-top:8px" }, "10분이 끝나서 자동으로 제출됐어요.") : null,
    firstWrongItems.length ? [h("p", { class: "kind" }, "1차에서 틀린 어휘"),
      h("ul", { class: "journey" }, firstWrongItems.map(it => h("li", {},
        h("b", {}, it.word), h("span", {}, `${it.q}`),
        h("span", {}, `내 답: ${E.picks[it.no] || "(무응답)"} → 정답: ${it.answer}` + (unresolved.includes(it.no) ? "  · 아직 어려움" : "  · 재시험에서 해결")))))] : h("p", { class: "allok" }, "1차에서 모두 맞혔어요!"),
    h("p", { class: "kind", style: "margin-top:24px" }, "결과 복사 (자동 제출이 안 될 때만)"),
    h("button", { type: "button", class: "btn ghost", onclick: async () => {
      const ok = await copyText(text); msg.className = "copied" + (ok ? "" : " fail");
      msg.textContent = ok ? "복사했어요. 카카오톡에 붙여넣어 보내세요." : "아래 글을 길게 눌러 복사하세요.";
    } }, "결과 복사"), msg, h("pre", { class: "out" }, text),
    h("button", { type: "button", class: "btn", style: "margin-top:20px", onclick: () => { E = null; renderStart(); } }, "처음 화면으로")
  );
}

/* =================================================================
   📒 나의 어휘장 — 예습을 끝낸 DAY에서만 열림
   · 점수, 퀴즈, 학습시간 없음 (R.completed 뒤라 학습시간 타이머가 멈춰 있음)
   · 기록(R)은 읽기만 하고 바꾸지 않음. 필터/가리기 설정만 따로 저장
   ================================================================= */
const VOCAB_PREFS = "prestudy:v2:vocabprefs";
const HIDE_FIELDS = [
  { key: "word",   label: "어휘 가리기" },
  { key: "desc",   label: "쉬운 한국어 뜻 가리기" },
  { key: "native", label: "내 나라 말 뜻 가리기" }
];
function renderVocab(from) {
  if (examActive()) { E = examActive(); return renderExam(); }   // 시험 중에는 잠금
  if (!R || !R.completed) return renderStart();          // 예습을 끝내야만 열림
  const prefs = store.get(VOCAB_PREFS) || {};
  let filter = prefs.filter || "all";
  const hide = { word: false, desc: false, native: false, ...(prefs.hide || {}) };
  const revealed = new Set();                             // 가린 칸 중 눌러서 연 칸
  const rv = classify(dayNos());
  const kindOf = no => rv.status[no] ? rv.status[no].kind : null;
  const isNew = no => (R.s1.entries[no] || {}).self === "new";
  const FILTERS = [
    { key: "all",    label: "전체",          test: () => true },
    { key: "yellow", label: "🟡 복습 권장",  test: no => kindOf(no) === "yellow" },
    { key: "red",    label: "🔴 집중 복습",  test: no => kindOf(no) === "red" },
    { key: "new",    label: "처음 본 단어",  test: isNew }
  ];
  const keep = () => store.set(VOCAB_PREFS, { filter, hide });

  const filterBox = h("div", { class: "vfilters", role: "group", "aria-label": "골라 보기" });
  const hideBox = h("div", { class: "vhides", role: "group", "aria-label": "가리기" });
  const list = h("ol", { class: "vlist" });
  const countLine = h("p", { class: "muted small", style: "margin:12px 0 0" });

  const shown = (no, key) => !hide[key] || revealed.has(no + ":" + key);   // 가려진 칸은 🔊도 숨김 (소리로 답이 새지 않게)
  function field(no, key, content, cls) {
    if (!hide[key] || revealed.has(no + ":" + key))
      return h("button", { type: "button", class: cls + (hide[key] ? " open" : ""), disabled: !hide[key],
        onclick: () => { revealed.delete(no + ":" + key); draw(); } }, content);
    return h("button", { type: "button", class: "cover " + cls, "aria-label": "눌러서 보기",
      onclick: () => { revealed.add(no + ":" + key); draw(); } }, "눌러서 보기");
  }
  function draw() {
    filterBox.innerHTML = ""; hideBox.innerHTML = ""; list.innerHTML = "";
    FILTERS.forEach(f => {
      const n = dayNos().filter(f.test).length;
      filterBox.append(h("button", { type: "button", class: "vchip", "aria-pressed": filter === f.key ? "true" : "false",
        onclick: () => { filter = f.key; revealed.clear(); keep(); draw(); } }, `${f.label} ${n}`));
    });
    HIDE_FIELDS.forEach(f => hideBox.append(h("button", { type: "button", class: "vchip hide", "aria-pressed": hide[f.key] ? "true" : "false",
      onclick: () => { hide[f.key] = !hide[f.key]; [...revealed].forEach(k => k.endsWith(":" + f.key) && revealed.delete(k)); keep(); draw(); } }, f.label)));

    const f = FILTERS.find(x => x.key === filter) || FILTERS[0];
    const nos = dayNos().filter(f.test);
    countLine.textContent = Object.values(hide).some(Boolean)
      ? `${nos.length}개. 가린 칸을 누르면 보이고, 다시 누르면 가려져요.` : `${nos.length}개`;
    if (!nos.length) { list.append(h("li", { class: "vempty" }, "여기에 해당하는 어휘가 없어요.")); return; }
    nos.forEach(no => {
      const w = L.W[no], e = R.s1.entries[no] || {}, k = kindOf(no);
      const tags = h("span", { class: "vtags" },
        k === "red" ? h("span", { class: "vtag red" }, "집중 복습") : null,
        k === "yellow" ? h("span", { class: "vtag yellow" }, "복습 권장") : null,
        isNew(no) ? h("span", { class: "vtag new" }, "처음 본 단어") : null);
      list.append(h("li", {},
        h("div", { class: "vtop" }, h("span", { class: "vno" }, no), tags),
        h("div", { class: "vrow" }, field(no, "word", w.word, "vword"), shown(no, "word") ? sayBtn("", w.word) : null),
        h("div", { class: "vrow" }, field(no, "desc", w.desc, "vdesc"), shown(no, "desc") ? sayBtn("", w.desc) : null),
        h("div", { class: "vrow" }, h("span", { class: "vlabel" }, "내가 쓴 뜻"), field(no, "native", e.native || "(없음)", "vnative"))));
    });
  }

  screen(
    h("button", { type: "button", class: "link", onclick: () => from === "start" ? renderStart() : renderFinal() },
      from === "start" ? "← 처음 화면" : "← 결과 화면"),
    h("h2", { style: "margin-top:8px" }, "📒 나의 어휘장"),
    h("p", { class: "muted" }, `${L.title} / DAY ${R.day} · ${who()}`),
    h("p", { class: "muted small" }, "점수 없이 자유롭게 복습하는 곳이에요. 가리고 떠올려 본 뒤 눌러서 확인하세요."),
    h("div", { class: "vctrl" },
      h("p", { class: "vcap" }, "골라 보기"), filterBox,
      h("p", { class: "vcap" }, "가리기"), hideBox),
    countLine, list,
    h("button", { type: "button", class: "btn ghost", style: "margin-top:24px", onclick: () => from === "start" ? renderStart() : renderFinal() },
      from === "start" ? "처음 화면으로" : "결과 화면으로")
  );
  draw();
}

renderStart();
</script>
</body>
</html>
